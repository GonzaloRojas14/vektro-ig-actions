name: Post Instagram Story

on:
  schedule:
    - cron: "0 9  * * 1"   # Monday    09:00 UTC — tech_tip
    - cron: "0 12 * * 2"   # Tuesday   12:00 UTC — service_promo
    - cron: "0 18 * * 3"   # Wednesday 18:00 UTC — quote
    - cron: "0 9  * * 4"   # Thursday  09:00 UTC — tech_tip
    - cron: "0 15 * * 5"   # Friday    15:00 UTC — data_viz
    - cron: "0 11 * * 6"   # Saturday  11:00 UTC — quote

  # Manual trigger — always posts the first story in content.json
  workflow_dispatch:

jobs:
  post-story:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post Instagram Story
        env:
          ACCESS_TOKEN:  ${{ secrets.ACCESS_TOKEN }}
          USER_ID:       ${{ secrets.USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python poster.py --force
          else
            # Pass the exact day+time so clock drift never causes a miss
            case "${{ github.event.schedule }}" in
              "0 9 * * 1")  python poster.py --day monday    --time 09:00 ;;
              "0 12 * * 2") python poster.py --day tuesday   --time 12:00 ;;
              "0 18 * * 3") python poster.py --day wednesday --time 18:00 ;;
              "0 9 * * 4")  python poster.py --day thursday  --time 09:00 ;;
              "0 15 * * 5") python poster.py --day friday    --time 15:00 ;;
              "0 11 * * 6") python poster.py --day saturday  --time 11:00 ;;
              *)            python poster.py ;;
            esac
          fi
